appId: ch.bfs.impi
productName: IMPI
directories:
  output: package
  app: app

files:
  - "**/*"
  - "!src/"

linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
  category: Office

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: bfs-preis
  repo: impi
