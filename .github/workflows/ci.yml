name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Build libraries
        run: pnpm --filter normalize-common --filter normalize-street --filter normalize-city --filter impilib run build
        working-directory: src

      - name: Run tests
        run: pnpm run test
        working-directory: src

      - name: Build Angular frontend
        run: pnpm run build:angular
        working-directory: src

      - name: Build Electron app
        run: pnpm run build:electron
        working-directory: src

      - name: Build CLI
        run: pnpm run build:cli
        working-directory: src

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python -m unittest discover -v tests
        working-directory: src/python
