name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Build libraries
        run: pnpm --filter normalize-common --filter normalize-street --filter normalize-city --filter impilib run build
        working-directory: src

      - name: Run tests
        run: pnpm run test
        working-directory: src

      - name: Create draft release
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-electron:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Build libraries
        run: pnpm --filter normalize-common --filter normalize-street --filter normalize-city --filter impilib run build
        working-directory: src

      - name: Build Angular frontend
        run: pnpm run build:angular
        working-directory: src

      - name: Build Electron app
        run: pnpm run build:electron
        working-directory: src

      - name: Resolve workspace refs and install Electron app dependencies
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const libsDir = path.resolve('libs');

            // Parse catalog versions from pnpm-workspace.yaml
            const catalogs = { '': {} };
            const yaml = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            let currentCatalog = '';
            let inCatalog = false;
            for (const line of yaml.split('\n')) {
              if (line.match(/^catalog:/)) { currentCatalog = ''; inCatalog = true; continue; }
              if (line.match(/^catalogs:/)) { inCatalog = true; continue; }
              if (line.match(/^[a-z]/) && !line.startsWith(' ')) { inCatalog = false; continue; }
              if (!inCatalog) continue;
              const namedCat = line.match(/^  ([a-z]+):$/);
              if (namedCat) { currentCatalog = namedCat[1]; catalogs[currentCatalog] = catalogs[currentCatalog] || {}; continue; }
              const entry = line.match(/^\s+['\"]?([^'\"]+)['\"]?:\s+(.+)$/);
              if (entry) { catalogs[currentCatalog] = catalogs[currentCatalog] || {}; catalogs[currentCatalog][entry[1].trim().replace(/[\"']/g,'')] = entry[2].trim(); }
            }

            function resolveDeps(deps) {
              if (!deps) return false;
              let changed = false;
              for (const [k, v] of Object.entries(deps)) {
                if (typeof v !== 'string') continue;
                if (v.startsWith('workspace:')) {
                  deps[k] = 'file:' + path.join(libsDir, k).split(path.sep).join('/');
                  changed = true;
                } else if (v.startsWith('catalog:')) {
                  const catalogName = v.slice(8) || '';
                  const resolved = (catalogs[catalogName] || {})[k];
                  if (resolved) { deps[k] = resolved; changed = true; }
                }
              }
              return changed;
            }

            // Resolve refs in workspace packages
            for (const lib of ['impilib', 'normalize-common', 'normalize-street', 'normalize-city']) {
              const p = path.join(libsDir, lib, 'package.json');
              if (!fs.existsSync(p)) continue;
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              const c1 = resolveDeps(pkg.dependencies);
              const c2 = resolveDeps(pkg.devDependencies);
              if (c1 || c2) fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            }

            // Update app/package.json to use absolute path for impilib
            const appPkg = JSON.parse(fs.readFileSync('electron/app/package.json', 'utf8'));
            appPkg.dependencies.impilib = 'file:' + path.join(libsDir, 'impilib').split(path.sep).join('/');
            fs.writeFileSync('electron/app/package.json', JSON.stringify(appPkg, null, 4));
          "
          cd electron/app && npm install --omit=dev --install-links
        shell: bash
        working-directory: src

      - name: Package & publish Electron
        run: npx electron-builder --${{ matrix.platform }} --publish onTagOrDraft
        working-directory: src/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-cli:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node22-linux-x64
            artifact: impi-cli-linux-x64
          - os: windows-latest
            target: node22-win-x64
            artifact: impi-cli-win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Build libraries
        run: pnpm --filter normalize-common --filter normalize-street --filter normalize-city --filter impilib run build
        working-directory: src

      - name: Build CLI
        run: pnpm run build:cli
        working-directory: src

      - name: Package CLI binary
        run: npx @yao-pkg/pkg . --targets ${{ matrix.target }} --output ${{ matrix.artifact }}
        working-directory: src/cli

      - name: Compress CLI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
        working-directory: src/cli

      - name: Compress CLI (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ${{ matrix.artifact }}.exe -DestinationPath ${{ matrix.artifact }}.zip
        working-directory: src/cli
        shell: pwsh

      - name: Upload CLI to release (Linux)
        if: runner.os == 'Linux'
        run: gh release upload "${{ github.ref_name }}" src/cli/${{ matrix.artifact }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI to release (Windows)
        if: runner.os == 'Windows'
        run: gh release upload "${{ github.ref_name }}" src/cli/${{ matrix.artifact }}.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
