name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Build libraries
        run: pnpm --filter normalize-common --filter normalize-street --filter normalize-city --filter impilib run build
        working-directory: src

      - name: Run tests
        run: pnpm run test
        working-directory: src

      - name: Create draft release
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-electron:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Build libraries
        run: pnpm --filter normalize-common --filter normalize-street --filter normalize-city --filter impilib run build
        working-directory: src

      - name: Build Angular frontend
        run: pnpm run build:angular
        working-directory: src

      - name: Build Electron app
        run: pnpm run build:electron
        working-directory: src

      - name: Install Electron app dependencies
        run: node electron/scripts/installAppDeps.js
        working-directory: src

      - name: Package & publish Electron
        run: npx electron-builder --${{ matrix.platform }} --publish onTagOrDraft
        working-directory: src/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-cli:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node22-linux-x64
            artifact: impi-cli-linux-x64
          - os: windows-latest
            target: node22-win-x64
            artifact: impi-cli-win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Bundle CLI
        run: pnpm --filter impi-cli run bundle
        working-directory: src

      - name: Package CLI
        run: |
          mkdir -p ${{ matrix.artifact }}
          # Native sidecar: sqlite3's compiled .node must sit next to the
          # executable. Built here on the matching OS/Node 22 runner so its ABI
          # matches the Node 22 runtime embedded in the pkg binary below.
          printf '{"private":true,"dependencies":{"sqlite3":"^5.1.7"}}\n' > ${{ matrix.artifact }}/package.json
          ( cd ${{ matrix.artifact }} && npm install --omit=dev && rm package.json package-lock.json )
          # Standalone executable with an embedded Node 22 runtime, so it no
          # longer depends on whatever Node the customer has installed.
          npx @yao-pkg/pkg cli/dist/bundle.cjs \
            --targets ${{ matrix.target }} \
            --output ${{ matrix.artifact }}/impi-cli
        shell: bash
        working-directory: src

      - name: Compress CLI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
        working-directory: src

      - name: Compress CLI (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip
        working-directory: src
        shell: pwsh

      - name: Upload CLI to release (Linux)
        if: runner.os == 'Linux'
        run: gh release upload "${{ github.ref_name }}" src/${{ matrix.artifact }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI to release (Windows)
        if: runner.os == 'Windows'
        run: gh release upload "${{ github.ref_name }}" src/${{ matrix.artifact }}.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-generate-db:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node22-linux-x64
            artifact: generate-impi-geo-database-linux-x64
          - os: windows-latest
            target: node22-win-x64
            artifact: generate-impi-geo-database-win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: src

      - name: Bundle generate-impi-geo-database
        run: pnpm --filter generate-impi-geo-database run bundle
        working-directory: src

      - name: Package generate-impi-geo-database
        run: |
          mkdir -p ${{ matrix.artifact }}
          # Native sidecar: better-sqlite3's compiled .node must sit next to the
          # executable, with an ABI matching the Node 22 runtime embedded in the
          # pkg binary below (ABI 127). 9.x ships no win32-x64 node-v127 prebuild
          # (only up to Node 21), so on Windows it would fall back to a source
          # build and fail; 12.x ships node-v127 prebuilds for every platform.
          # better-sqlite3 is `external` in the bundle, so the exe loads it
          # entirely from this sidecar — the version is independent of the build.
          printf '{"private":true,"dependencies":{"better-sqlite3":"^12.10.1"}}\n' > ${{ matrix.artifact }}/package.json
          ( cd ${{ matrix.artifact }} && npm install --omit=dev && rm package.json package-lock.json )
          # Standalone executable with an embedded Node 22 runtime, so it no
          # longer depends on whatever Node the customer has installed.
          npx @yao-pkg/pkg libs/generate-impi-geo-database/dist/bundle.cjs \
            --targets ${{ matrix.target }} \
            --output ${{ matrix.artifact }}/generate-impi-db
        shell: bash
        working-directory: src

      - name: Compress (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
        working-directory: src

      - name: Compress (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip
        working-directory: src
        shell: pwsh

      - name: Upload to release (Linux)
        if: runner.os == 'Linux'
        run: gh release upload "${{ github.ref_name }}" src/${{ matrix.artifact }}.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (Windows)
        if: runner.os == 'Windows'
        run: gh release upload "${{ github.ref_name }}" src/${{ matrix.artifact }}.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
